movie_details:
  name: Film details and tracks
  description: Get a film's audio and subtitle tracks through the tvOS app.
  target:
    entity:
      integration: cinemaseat
      domain: media_player
  fields:
    movie_id:
      name: Film ID
      required: true
      selector:
        text:
select_audio:
  name: Select audio
  description: Switch audio in the current film. The session ID prevents controlling another film.
  target:
    entity:
      integration: cinemaseat
      domain: media_player
  fields:
    track_id:
      name: Audio track ID
      required: true
      selector:
        text:
    session_id:
      name: Session ID
      required: true
      selector:
        text:
select_subtitle:
  name: Select subtitles
  description: Choose a subtitle track for the current film or turn subtitles off.
  target:
    entity:
      integration: cinemaseat
      domain: media_player
  fields:
    track_id:
      name: Subtitle track ID
      selector:
        text:
    "off":
      name: Subtitles off
      default: false
      selector:
        boolean:
    session_id:
      name: Session ID
      required: true
      selector:
        text:
show_curtain:
  name: Show curtain
  description: Show the closed curtain on the selected player before starting a film. The film start opens it automatically.
  target:
    entity:
      integration: cinemaseat
      domain: media_player
  fields:
    show:
      name: Show curtain
      default: true
      selector:
        boolean:

prepare_sequence:
  name: Prepare Play Sequence
  description: Prepare an indexed NAS film and emit prepare_start_sequence. A separate Start Sequence action releases the presentation.
  target:
    entity:
      integration: cinemaseat
      domain: media_player
  fields:
    movie_id:
      name: NAS film ID
      required: true
      selector:
        text:
    audio_id:
      name: Audio track ID
      selector:
        text:
    subtitle_id:
      name: Subtitle track ID
      selector:
        text:
    subtitles_off:
      name: Subtitles off
      default: true
      selector:
        boolean:
start_sequence:
  name: Start Sequence
  description: Release only the presentation identified by the triggering prepare_start_sequence event. Playback begins when local preparation is ready.
  target:
    entity:
      integration: cinemaseat
      domain: media_player
  fields:
    presentation_id:
      name: Presentation ID from the prepare event
      required: true
      selector:
        text:
advance_sequence:
  name: Skip sequence step
  description: Start a ready opening or skip the current preroll clip. Does not bypass a pending HA release or seek within a bumper.
  target:
    entity:
      integration: cinemaseat
      domain: media_player
